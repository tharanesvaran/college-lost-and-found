    // Web Audio Subtle Chime
    function playBeep(type = 'success') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'success') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'alert') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(330, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    // Confetti Cannon
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const colors = ['#2563eb', '#f59e0b', '#10b981', '#ec4899', '#6366f1', '#fbbf24'];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 1.1) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          rotSpd: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }
      let frame;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rot += p.rotSpd;
          p.opacity -= 0.009;
          if (p.opacity > 0) {
            active = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
            ctx.restore();
          }
        });
        if (active) frame = requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    // Category Emoji Mapping
    function getCategoryEmoji(cat) {
      switch(cat) {
        case 'Electronics': return '💻';
        case 'Wallets & Purses': return '👛';
        case 'ID Cards & Documents': return '🪪';
        case 'Keys': return '🔑';
        case 'Books & Notes': return '📚';
        case 'Bags & Pouches': return '🎒';
        case 'Water Bottles': return '💧';
        case 'Clothing & Watches': return '⌚';
        case 'Valuables & Jewelry': return '💍';
        default: return '📦';

    // =========================================================================
    // DR. MAHALINGAM COLLEGE INTERACTIVE CAMPUS MAP COMPONENT
    // Replicates the layout of the user's Google Maps screenshot:
    // Nachimuthu Polytechnic on west, Dr. MCET on east, Indian Bank, Block B, NH 83
    // =========================================================================
    function CampusMapPicker({ selectedLocation, onSelectLocation, height = "h-80", interactive = true }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markerRef = useRef(null);
      const [viewMode, setViewMode] = useState('osm'); // 'osm' or 'blueprint' (screenshot matched theme)

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Initialize Leaflet map
        if (!leafletMapRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: selectedLocation?.lat ? [selectedLocation.lat, selectedLocation.lng] : MCET_CENTER,
            zoom: 17,
            zoomControl: true
          });

          // OpenStreetMap Tile Layer
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors | MCET Campus Map',
            maxZoom: 19
          }).addTo(map);

          // Add building markers for key landmarks from screenshot
          CAMPUS_LOCATIONS.forEach(loc => {
            const isHighlight = loc.id === 'block-b' || loc.id === 'indian-bank' || loc.id === 'mcet-main';
            const iconHtml = `
              <div class="px-2 py-1 rounded-md text-[11px] font-bold shadow-md flex items-center gap-1 border whitespace-nowrap ${
                loc.id === 'block-b' 
                  ? 'bg-blue-600 text-white border-blue-400' 
                  : loc.id === 'indian-bank'
                  ? 'bg-amber-500 text-slate-950 border-amber-300'
                  : 'bg-slate-900 text-white border-slate-700'
              }">
                <span>${loc.id === 'indian-bank' ? '🏦' : loc.id === 'block-b' ? '🏢' : '🎓'}</span>
                <span>${loc.name.split('(')[0]}</span>
              </div>
            `;
            const customIcon = L.divIcon({
              html: iconHtml,
              className: 'custom-campus-label',
              iconSize: [120, 26],
              iconAnchor: [60, 13]
            });

            const m = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);
            m.bindPopup(`<strong>${loc.name}</strong><br/><span class="text-xs text-slate-500">${loc.desc}</span>`);
            m.on('click', () => {
              if (interactive && onSelectLocation) {
                onSelectLocation({
                  lat: loc.lat,
                  lng: loc.lng,
                  locationName: loc.name,
                  zone: loc.name.split('(')[0].trim()
                });
              }
            });
          });

          // Interactive click to drop pin
          if (interactive) {
            map.on('click', (e) => {
              const { lat, lng } = e.latlng;
              // Detect nearest campus building
              let nearest = CAMPUS_LOCATIONS[0];
              let minDist = 999999;
              CAMPUS_LOCATIONS.forEach(loc => {
                const dist = Math.hypot(lat - loc.lat, lng - loc.lng);
                if (dist < minDist) {
                  minDist = dist;
                  nearest = loc;
                }
              });

              const locName = `${nearest.name.split('(')[0].trim()} (Near ${nearest.desc})`;
              if (onSelectLocation) {
                onSelectLocation({
                  lat: Math.round(lat * 100000) / 100000,
                  lng: Math.round(lng * 100000) / 100000,
                  locationName: locName,
                  zone: nearest.name.split('(')[0].trim()
                });
              }
            });
          }

          leafletMapRef.current = map;
        }

        return () => {
          // clean up on unmount
          if (leafletMapRef.current) {
            leafletMapRef.current.remove();
            leafletMapRef.current = null;
          }
        };
      }, []);

      // Update pin marker when selectedLocation changes
      useEffect(() => {
        if (!leafletMapRef.current) return;
        const map = leafletMapRef.current;

        if (selectedLocation && selectedLocation.lat && selectedLocation.lng) {
          if (markerRef.current) {
            markerRef.current.setLatLng([selectedLocation.lat, selectedLocation.lng]);
          } else {
            const pinIcon = L.divIcon({
              html: `
                <div class="relative flex items-center justify-center">
                  <div class="absolute w-8 h-8 bg-red-500 rounded-full animate-ping opacity-75"></div>
                  <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg border-2 border-white">
                    📍
                  </div>
                </div>
              `,
              className: 'custom-pin-marker',
              iconSize: [32, 32],
              iconAnchor: [16, 16]
            });
            markerRef.current = L.marker([selectedLocation.lat, selectedLocation.lng], { icon: pinIcon }).addTo(map);
          }
          map.setView([selectedLocation.lat, selectedLocation.lng], 17);
        } else if (markerRef.current) {
          markerRef.current.remove();
          markerRef.current = null;
        }
      }, [selectedLocation]);

      return (
        <div class="relative rounded-2xl overflow-hidden border border-slate-300 shadow-sm bg-slate-900">
          {/* Top HUD Bar */}
          <div class="absolute top-3 left-3 right-3 z-[1000] flex items-center justify-between pointer-events-none">
            <div class="bg-slate-950/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-700/80 text-xs font-semibold text-white shadow-lg pointer-events-auto flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>Dr. Mahalingam College (MCET) • Campus GIS</span>
            </div>
            <div class="flex items-center gap-2 pointer-events-auto">
              <button 
                type="button" 
                onClick={() => setViewMode(viewMode === 'osm' ? 'blueprint' : 'osm')}
                class="bg-slate-950/90 hover:bg-slate-800 backdrop-blur-md text-amber-400 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold shadow-lg transition flex items-center gap-1.5"
              >
                <Icon name="layers" className="w-3.5 h-3.5" />
                <span>{viewMode === 'osm' ? 'Blueprint View' : 'Live OSM Tiles'}</span>
              </button>
            </div>
          </div>

          {/* Interactive Blueprint Mode (Mirroring the Dark Mode Screenshot) */}
          {viewMode === 'blueprint' ? (
            <div class={`relative w-full ${height} bg-[#071026] text-white overflow-hidden p-4 select-none flex flex-col justify-between`}>
              {/* Screenshot Replicated Architectural Canvas */}
              <div class="absolute inset-0 opacity-90 pointer-events-auto" onClick={(e) => {
                if (!interactive) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                // Map screen % to MCET coordinates
                const lat = 10.6645 - y * 0.004;
                const lng = 77.0080 + x * 0.0045;
                let zone = "Campus Pathway";
                if (x < 0.45 && y > 0.3) zone = "Nachimuthu Polytechnic College";
                else if (x >= 0.45 && y > 0.5) zone = "Block B (South Quadrangle)";
                else if (x >= 0.45 && y > 0.35 && y <= 0.5) zone = "Indian Bank & ATM Branch";
                else if (x >= 0.45 && y <= 0.35) zone = "Dr. MCET Main Academic Block";
                if (onSelectLocation) {
                  onSelectLocation({ lat: Math.round(lat * 100000)/100000, lng: Math.round(lng * 100000)/100000, locationName: zone, zone });
                }
              }}>
                <svg class="w-full h-full" viewBox="0 0 400 240">
                  {/* Top Highway NH 83 */}
                  <rect x="0" y="28" width="400" height="26" fill="#1b2a47" />
                  <text x="140" y="44" fill="#94a3b8" font-size="9" font-weight="bold">NH 83 — Udumalai Road</text>
                  <circle cx="95" cy="41" r="5" fill="#3b82f6" />
                  <text x="92" y="44" fill="#fff" font-size="7">🚌</text>

                  {/* Left Block: Nachimuthu Polytechnic College */}
                  <rect x="35" y="75" width="115" height="135" rx="8" fill="#111c38" stroke="#253b66" stroke-width="2" />
                  <path d="M 60,95 L 125,95 L 125,125 L 105,125 L 105,185 L 60,185 Z" fill="#1c2d52" />
                  <circle cx="90" cy="110" r="10" fill="#2563eb" opacity="0.3" />
                  <text x="42" y="90" fill="#93c5fd" font-size="8.5" font-weight="bold">Nachimuthu</text>
                  <text x="42" y="100" fill="#93c5fd" font-size="7.5">Polytechnic College</text>
                  <text x="42" y="110" fill="#64748b" font-size="6.5">நாச்சிமுத்து...</text>

                  {/* Right Upper: Dr. Mahalingam College of Engineering */}
                  <rect x="200" y="70" width="165" height="70" rx="8" fill="#111c38" stroke="#253b66" stroke-width="2" />
                  <text x="210" y="86" fill="#93c5fd" font-size="8.5" font-weight="bold">Dr. Mahalingam</text>
                  <text x="210" y="96" fill="#93c5fd" font-size="7.5">College of Engg &amp; Tech</text>
                  <text x="210" y="106" fill="#64748b" font-size="6.5">டாக்டர். மகாலிங்கம்...</text>

                  {/* Indian Bank Branch (as seen in screenshot) */}
                  <rect x="200" y="125" width="165" height="26" fill="#192849" stroke="#3b82f6" stroke-width="1.5" rx="4" />
                  <text x="212" y="142" fill="#fbbf24" font-size="9" font-weight="bold">🏦 INDIAN BANK</text>
                  <text x="280" y="142" fill="#94a3b8" font-size="7">இந்திய வங்கி</text>

                  {/* Block B (as seen in screenshot directly below Indian Bank) */}
                  <rect x="200" y="155" width="165" height="65" rx="8" fill="#152342" stroke="#3b82f6" stroke-width="2" />
                  <rect x="220" y="170" width="125" height="40" fill="#1e3461" rx="4" />

                  <text x="235" y="195" fill="#cbd5e1" font-size="8">Classrooms &amp; Laboratories</text>

                  {/* Connecting Pathways */}
                  <line x1="175" y1="54" x2="175" y2="240" stroke="#334155" stroke-width="6" />

                  <line x1="150" y1="120" x2="175" y2="120" stroke="#334155" stroke-width="4" />

                  {/* Selected Marker Pin */}
                  {selectedLocation && (
                    <g>
                      <circle cx="280" cy="180" r="16" fill="#ef4444" opacity="0.3" />

                      <text x="272" y="174" fill="#ffffff" font-size="14">📍</text>
                    </g>
                  )}

              </div>

              <div class="relative z-10 mt-auto bg-slate-950/80 backdrop-blur-md p-2.5 rounded-xl border border-slate-800 text-xs flex justify-between items-center">

          {/* Bottom Selected Location Pill */}

                  : "Tap on the map to pinpoint where the item was found/lost"}

            {selectedLocation?.lat && (

    // =========================================================================
    // MANDATORY STUDENT PROFILE SETUP MODAL
    // Required on first-time Google sign-in before any feature can be accessed!
    // =========================================================================
    function MandatoryProfileModal({ user, onSave }) {
      const [fullName, setFullName] = useState(user.displayName || user.fullName || '');
      const [rollNumber, setRollNumber] = useState('');
      const [phone, setPhone] = useState('');
      const [yearOfStudy, setYearOfStudy] = useState('1st Year');
      const [department, setDepartment] = useState('Computer Science & Engineering (CSE)');
      const [error, setError] = useState('');

      const departments = [
        'Computer Science & Engineering (CSE)',
        'Information Technology (IT)',
        'Artificial Intelligence & Data Science (AI&DS)',
        'Electronics & Communication Engineering (ECE)',
        'Electrical & Electronics Engineering (EEE)',
        'Mechanical Engineering',
        'Civil Engineering',
        'Automobile Engineering',
        'Mechatronics Engineering',
        'Master of Computer Applications (MCA)'
      ];

      function handleSubmit(e) {
        e.preventDefault();
        if (!fullName.trim() || !rollNumber.trim() || !phone.trim()) {
          setError('Please fill in all mandatory profile fields.');
          return;
        }
        // Validate roll number format (e.g., 7276...)
        if (rollNumber.length < 6) {
          setError('Please enter a valid college registration roll number.');
          return;
        }

        onSave({
          fullName: fullName.trim(),
          rollNumber: rollNumber.trim().toUpperCase(),
          phone: phone.trim(),
          yearOfStudy,
          department,
          profileComplete: true
        });
      }

      return (
        <div class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
            {/* Header Banner */}
            <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-6 relative">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-400 text-2xl">
                  🎓
                </div>
                <div>
                  <h2 class="text-xl font-heading font-extrabold text-white">Student Profile Verification</h2>
                  <p class="text-xs text-slate-300">Mandatory first-time enrollment for MCET Property Portal</p>
                </div>
              </div>
              <div class="mt-3 bg-amber-400/10 border border-amber-400/30 rounded-xl p-2.5 text-xs text-amber-200 flex items-center gap-2">
                <Icon name="shield" className="w-4 h-4 text-amber-400 flex-shrink-0" />
                <span>Privacy Rule: Only college administrators can view your profile data.</span>
              </div>
            </div>

            {/* Form */}
            <form onSubmit={handleSubmit} class="p-6 space-y-4">
              {error && (
                <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs flex items-center gap-2">
                  <Icon name="alertTriangle" className="w-4 h-4 text-red-600 flex-shrink-0" />
                  <span>{error}</span>
                </div>
              )}

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                  Verified Google Account (Gmail)
                </label>
                <input 
                  type="text" 
                  value={user.email} 
                  disabled 
                  class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-600 cursor-not-allowed" 
                />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Full Name <span class="text-red-500">*</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    value={fullName} 
                    onChange={e => setFullName(e.target.value)} 
                    placeholder="e.g. Priya Sundaram" 
                    class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" 
                  />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    College Roll Number <span class="text-red-500">*</span>
                  </label>
                  <input 
                    type="text" 
                    required 
                    value={rollNumber} 
                    onChange={e => setRollNumber(e.target.value)} 
                    placeholder="e.g. 727622BCS042" 
                    class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono uppercase focus:ring-2 focus:ring-blue-600 focus:outline-none" 
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Phone / WhatsApp <span class="text-red-500">*</span>
                  </label>
                  <input 
                    type="tel" 
                    required 
                    value={phone} 
                    onChange={e => setPhone(e.target.value)} 
                    placeholder="+91 98765 43210" 
                    class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none" 
                  />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Year of Study <span class="text-red-500">*</span>
                  </label>
                  <select

    // =========================================================================
    // LOGIN COMPONENT (GOOGLE SIGN-IN ONLY, DUAL ROLES, ADMIN ALLOWLIST CHECK)
    // =========================================================================
    function LoginScreen({ onLoginSuccess, db }) {
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [adminUsername, setAdminUsername] = useState('');
      const [authError, setAuthError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      // Trigger Google Sign-in flow
      function handleGoogleSignIn(demoUser = null) {
        setAuthError('');
        setIsAuthenticating(true);

        setTimeout(() => {
          let userObj = demoUser;
          if (!userObj) {
            // Prompt simulation of Google popup if testing custom email
            const emailInput = prompt("Google Sign-In Simulation:\nEnter your Google Email account:", isAdminMode ? "admin@mcet.in" : "student@mcet.in");
            if (!emailInput) {
              setIsAuthenticating(false);
              return;
            }
            userObj = {
              uid: 'usr_' + Date.now(),
              email: emailInput.trim().toLowerCase(),
              displayName: emailInput.split('@')[0].replace(/[._]/g, ' ')
            };
          }

          // ADMIN ROLE VERIFICATION LOGIC
          if (isAdminMode) {
            const entered = adminUsername.trim().toLowerCase();
            if (!entered.endsWith('.admin')) {
              setAuthError('Admin access denied: Admin username must end with ".admin" (e.g. office1.admin).');
              setIsAuthenticating(false);
              playBeep('alert');
              return;
            }

            // Check admin allowlist
            const allowlistEntry = db.adminAllowlist[entered];
            if (!allowlistEntry || !allowlistEntry.active) {
              setAuthError(`Admin access denied: The username "${entered}" is not in the approved database allowlist.`);
              setIsAuthenticating(false);
              playBeep('alert');
              return;
            }

            // Check Google account mapped to this admin username
            if (userObj.email !== allowlistEntry.email) {
              setAuthError(`Refused Admin Access: The Google account "${userObj.email}" is not authorized for username "${entered}". Only "${allowlistEntry.email}" is permitted.`);
              setIsAuthenticating(false);
              playBeep('alert');
              return;
            }

            // Successfully authenticated as Admin
            playBeep('success');
            fireConfetti();
            onLoginSuccess({
              uid: 'admin_' + entered,
              role: 'admin',
              adminUsername: entered,
              email: userObj.email,
              fullName: allowlistEntry.name || 'Campus Administrator',
              profileComplete: true
            });
          } else {
            // STUDENT ROLE
            // Check if student profile already exists in DB
            const existingStudent = Object.values(db.users).find(u => u.email === userObj.email);
            if (existingStudent) {
              playBeep('success');
              onLoginSuccess({ ...existingStudent, role: 'student' });
            } else {
              // First-time student: needs mandatory profile setup
              onLoginSuccess({
                uid: userObj.uid || ('std_' + Date.now()),
                role: 'student',
                email: userObj.email,
                fullName: userObj.displayName || '',
                profileComplete: false
              });
            }
          }
          setIsAuthenticating(false);
        }, 400);
      }

      return (

          <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 relative z-10">

            <div class="bg-gradient-to-b from-slate-950 to-slate-900 p-8 text-center text-white relative">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-amber-500 mx-auto flex items-center justify-center text-3xl shadow-xl shadow-blue-500/25 mb-4">
                🎓
              </div>
              <h1 class="text-2xl font-heading font-extrabold tracking-tight">College Lost &amp; Found</h1>
              <p class="text-xs text-amber-400 font-semibold tracking-wide uppercase mt-1">
                Dr. Mahalingam College of Engineering &amp; Technology
              </p>
              <p class="text-xs text-slate-400 mt-1">Autonomous Anna University Institution • Pollachi</p>
            </div>

            {/* Login Card Body */}
            <div class="p-8">
              {authError && (
                <div class="mb-5 bg-red-50 border border-red-200 text-red-700 p-3.5 rounded-2xl text-xs flex items-start gap-2.5">
                  <Icon name="alertTriangle" className="w-4 h-4 text-red-600 flex-shrink-0 mt-0.5" />

    // =========================================================================
    // STUDENT PORTAL: BROWSE FOUND ITEMS (SENSITIVE ITEMS HIDDEN)
    // =========================================================================
    function StudentBrowse({ items, onInitiateClaim }) {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('All');

      // Rule: Sensitive categories (ID cards, ATM cards, certificates) are NEVER shown publicly!
      // Only Unclaimed items with isSensitive != true are displayed.
      const publicItems = useMemo(() => {
        return items.filter(item => {
          if (item.status !== 'Unclaimed') return false;
          if (item.isSensitive === true) return false;
          if (item.category === 'ID Cards & Documents') return false; // Sensitive categories hidden completely

          const matchCat = category === 'All' || item.category === category;
          const matchSearch = !search || 
            item.title.toLowerCase().includes(search.toLowerCase()) || 
            item.description.toLowerCase().includes(search.toLowerCase()) ||
            item.locationName.toLowerCase().includes(search.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [items, search, category]);

      const categories = ['All', 'Electronics', 'Wallets & Purses', 'Keys', 'Books & Notes', 'Bags & Pouches', 'Water Bottles', 'Clothing & Watches', 'Other'];

      return (

              <h2 class="text-xl font-heading font-extrabold text-slate-900">Browse Unclaimed Campus Articles</h2>

              <span>📦</span>
              <span>{publicItems.length} Live Unclaimed Articles</span>

          </div>

          {/* Search & Category Filter Pills */}

              <Icon name="search" className="w-5 h-5 text-slate-400 absolute left-3.5 top-3" />
              <input 
                type="text" 
                value={search} 
                onChange={e => setSearch(e.target.value)} 
                placeholder="Search by keywords, general location (e.g. Block B, Library)..." 
                class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 focus:bg-white focus:outline-none" 
              />
            </div>
            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
              {categories.map(cat => (
                <button 
                  key={cat}

                  onClick={() => setCategory(cat)} 
                  class={`px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition flex items-center gap-1.5 ${
                    category === cat 
                      ? 'bg-slate-900 text-white shadow-sm' 
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                  <span>{cat === 'All' ? '🌐' : getCategoryEmoji(cat)}</span>
                  <span>{cat}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Items Grid */}
          {publicItems.length === 0 ? (
            <div class="bg-white rounded-3xl p-12 text-center border border-slate-200 shadow-sm">
              <div class="w-16 h-16 rounded-2xl bg-slate-100 mx-auto flex items-center justify-center text-3xl mb-3">
                🔍
              </div>
              <h3 class="text-base font-bold text-slate-800">No Matching Unclaimed Belongings</h3>

    // =========================================================================
    // STUDENT CLAIM REQUEST MODAL (1-2 VERIFICATION QUESTIONS)
    // =========================================================================
    function ClaimModal({ item, student, onClose, onSubmitClaim }) {
      const [answers, setAnswers] = useState(['', '']);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState('');

      const questions = item.verificationQuestions || [
        "What distinctive mark, color, sticker, or unique detail proves this belongs to you?"
      ];

      function handleSubmit(e) {
        e.preventDefault();
        if (!answers[0].trim()) {
          setError('Please provide an answer to question #1.');
          return;
        }

        setIsSubmitting(true);
        setTimeout(() => {
          onSubmitClaim({
            itemId: item.id,
            itemTitle: item.title,
            studentUid: student.uid,
            studentRollNo: student.rollNumber,
            studentName: student.fullName,
            studentPhone: student.phone,
            studentDept: student.department,
            answers: answers.filter(a => a.trim().length > 0),
            status: 'Requested',
            createdAt: new Date().toISOString()
          });
          setIsSubmitting(false);
          playBeep('success');
          fireConfetti();
          onClose();
        }, 400);
      }

      return (
        <div class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in-95">
            <div class="bg-slate-900 text-white p-5 flex items-center justify-between">
              <div>
                <span class="text-[11px] font-mono text-amber-400 font-bold">{item.id} • {item.category}</span>
                <h3 class="text-base font-bold text-white mt-0.5">{item.title}</h3>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white text-xl p-1 font-bold">&times;</button>
            </div>

            <form onSubmit={handleSubmit} class="p-6 space-y-4">
              <div class="bg-amber-50 border border-amber-200 text-amber-900 p-3.5 rounded-2xl text-xs leading-relaxed">
                <strong>🔒 Ownership Challenge:</strong> To prevent fraudulent claims, answer the questions below that only the genuine owner would know (e.g. wallpaper, specific stickers, contents, private repairs).
              </div>

              {error && (
                <div class="text-xs text-red-600 bg-red-50 p-2.5 rounded-xl border border-red-200">
                  {error}
                </div>
              )}

              {questions.map((q, idx) => (
                <div key={idx} class="space-y-1.5">
                  <label class="block text-xs font-bold text-slate-800">
                    Question {idx + 1}: <span class="text-blue-700 font-medium">"{q}"</span>
                  </label>
                  <textarea 
                    rows="2" 
                    required={idx === 0} 
                    value={answers[idx]} 
                    onChange={e => {
                      const next = [...answers];
                      next[idx] = e.target.value;
                      setAnswers(next);
                    }} 
                    placeholder="Enter precise private details to prove ownership..." 
                    class="w-full border border-slate-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-blue-600 focus:outline-none" 
                  />
                </div>
              ))}

              <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-600">
                <div><strong>Claimant:</strong> {student.fullName} ({student.rollNumber})</div>
                <div class="text-[11px] text-slate-500 mt-0.5">Admin will review your answers. Once approved, present your physical College ID card at pickup.</div>
              </div>

              <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" onClick={onClose} class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">
                  Cancel
                </button>
                <button type="submit" disabled={isSubmitting} class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md">
                  {isSubmitting ? 'Submitting Claim...' : 'Submit Claim for Review'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function StudentClaimsTracking({ student, claims }) {
      const studentClaims = useMemo(() => {

      }, [claims, student]);

      const steps = ['Requested', 'Approved', 'Ready for Pickup', 'Collected'];

      function getStepIndex(status) {
        if (status === 'Rejected') return -1;
        return steps.indexOf(status);
      }

      return (
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-heading font-extrabold text-slate-900">My Claim Status &amp; Timeline</h2>

              </p>
            </div>
          ) : (
            <div class="space-y-5">
              {studentClaims.map(claim => {
                const stepIdx = getStepIndex(claim.status);
                const isRejected = claim.status === 'Rejected';

                return (
                  <div key={claim.id} class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                      <div>

                            {claim.id}

                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mt-1">{claim.itemTitle}</h3>

                      <div>
                        <span class={`px-3 py-1 rounded-full text-xs font-extrabold inline-flex items-center gap-1.5 ${
                          claim.status === 'Collected' 
                            ? 'bg-emerald-100 text-emerald-800' 
                            : claim.status === 'Ready for Pickup'
                            ? 'bg-amber-100 text-amber-900 animate-pulse'
                            : isRejected
                            ? 'bg-red-100 text-red-800'
                            : 'bg-blue-100 text-blue-800'
                        }`}>
                          <span>●</span> {claim.status}
                        </span>
                      </div>
                    </div>

                    {/* Visual 4-Step Timeline */}
                    {!isRejected ? (
                      <div class="relative py-2">
                        <div class="hidden sm:block absolute top-1/2 left-6 right-6 h-1 bg-slate-200 -translate-y-1/2 z-0"></div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 relative z-10">
                          {steps.map((st, i) => {
                            const isDone = i <= stepIdx;
                            const isCurrent = i === stepIdx;
                            return (
                              <div key={st} class="flex flex-col items-center text-center">
                                <div class={`w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-sm shadow-md transition ${
                                  isDone

                                </div>
                                <span class={`mt-2 text-xs font-bold ${isDone ? 'text-slate-900' : 'text-slate-400'}`}>
                                  {st}
                                </span>
                              </div>
                            );
                          })}

                      </div>
                    ) : (
                      <div class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-2xl text-xs">
                        <strong>Claim Rejected:</strong> {claim.rejectionReason || "Verification answers did not match logged item identifiers."}
                      </div>
                    )}

                    {/* Pickup Instruction Alert if Ready for Pickup */}
                    {claim.status === 'Ready for Pickup' && (
                      <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-300 rounded-2xl p-4 text-xs text-amber-950 flex items-start gap-3">

    // =========================================================================
    // ADMIN DASHBOARD (KPIs, HOLDING PERIOD COUNTDOWN, SEARCH & FILTERS)
    // =========================================================================
    function AdminDashboard({ db, onNavigate, onResolveExpiry, holdingPeriodDays = 45 }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [categoryFilter, setCategoryFilter] = useState('All');

      const items = db.items || [];
      const claims = db.claims || [];
      const lostReports = db.lostReports || [];

      // Calculate days left in holding period for each item
      function calculateHoldingCountdown(item) {
        const foundDate = new Date(item.dateFound);
        const today = new Date();
        const diffDays = Math.floor((today - foundDate) / (1000 * 60 * 60 * 24));
        const daysLeft = holdingPeriodDays - diffDays;
        return { diffDays, daysLeft, isExpired: daysLeft <= 0 };
      }

      // Filtered items
      const filteredItems = useMemo(() => {
        return items.filter(it => {
          const matchStatus = statusFilter === 'All' || it.status === statusFilter;
          const matchCategory = categoryFilter === 'All' || it.category === categoryFilter;
          const matchSearch = !search ||
            it.title.toLowerCase().includes(search.toLowerCase()) ||
            it.id.toLowerCase().includes(search.toLowerCase()) ||
            it.locationName.toLowerCase().includes(search.toLowerCase()) ||
            (it.storageNumber && it.storageNumber.toLowerCase().includes(search.toLowerCase()));
          return matchStatus && matchCategory && matchSearch;
        });
      }, [items, search, statusFilter, categoryFilter]);

      // High-level KPI counts
      const unclaimedCount = items.filter(i => i.status === 'Unclaimed').length;
      const claimedCount = items.filter(i => i.status === 'Claimed').length;
      const returnedCount = items.filter(i => i.status === 'Returned').length;
      const expiredCount = items.filter(i => i.status === 'Expired').length;
      const pendingClaimsCount = claims.filter(c => c.status === 'Requested').length;
      const lockedCabinetCount = items.filter(i => i.isLockedCabinet).length;

    // =========================================================================

      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Electronics');
      const [description, setDescription] = useState('');
      const [privateNotes, setPrivateNotes] = useState('');
      const [dateFound, setDateFound] = useState(new Date().toISOString().split('T')[0]);
      const [storageNumber, setStorageNumber] = useState('Shelf A-3');
      const [isLockedCabinet, setIsLockedCabinet] = useState(true);
      const [lockedCabinetNo, setLockedCabinetNo] = useState('Locked Cabinet #1');
      const [finderSearch, setFinderSearch] = useState('');
      const [selectedFinder, setSelectedFinder] = useState(null);
      const [selectedLocation, setSelectedLocation] = useState({
        lat: 10.6612,
        lng: 77.0103,
        locationName: 'Block B (South Quadrangle)',
        zone: 'Block B'
      });
      const [question1, setQuestion1] = useState('What color or serial number is on the item?');
      const [answer1, setAnswer1] = useState('');
      const [question2, setQuestion2] = useState('What distinctive stickers or private markings are present?');
      const [answer2, setAnswer2] = useState('');
      const [isSensitive, setIsSensitive] = useState(false);

      const categories = [
        'Electronics', 
        'Wallets & Purses', 
        'ID Cards & Documents', 
        'Keys', 
        'Books & Notes', 
        'Bags & Pouches', 
        'Water Bottles', 
        'Clothing & Watches', 
        'Valuables & Jewelry', 
        'Other'
      ];

      // Auto-suggest "Locked Cabinet" for valuables
      useEffect(() => {
        const valuables = ['Electronics', 'Wallets & Purses', 'Valuables & Jewelry'];
        if (valuables.includes(category)) {
          setIsLockedCabinet(true);
        }
        if (category === 'ID Cards & Documents') {
          setIsSensitive(true);
        } else {
          setIsSensitive(false);
        }
      }, [category]);

      // Filter students by search
      const studentMatches = useMemo(() => {
        if (!finderSearch.trim()) return [];
        const q = finderSearch.toLowerCase();
        return Object.values(students).filter(s => 
          s.fullName.toLowerCase().includes(q) || s.rollNumber.toLowerCase().includes(q)
        );
      }, [students, finderSearch]);

      function handleSubmit(e) {
        e.preventDefault();
        const id = `MCET-FND-${Math.floor(100 + Math.random() * 899)}`;
        const newItem = {
          id,
          title: title.trim(),
          category,
          description: description.trim(),
          privateNotes: privateNotes.trim(),
          dateFound,
          locationName: selectedLocation.locationName,
          coordinates: selectedLocation,
          finderRollNo: selectedFinder?.rollNumber || finderSearch || 'Campus Member',
          finderName: selectedFinder?.fullName || 'Verified Good Samaritan',
          storageNumber,
          isLockedCabinet,
          lockedCabinetNo: isLockedCabinet ? lockedCabinetNo : null,
          isSensitive,
          verificationQuestions: [question1, question2].filter(q => q.trim().length > 0),
          verificationAnswers: [answer1, answer2].filter(a => a.trim().length > 0),
          status: 'Unclaimed',
          createdAt: new Date().toISOString()
        };

        onSaveItem(newItem);
        playBeep('success');
        fireConfetti();
        alert(`Article logged successfully with Token ID: ${id}`);
        // Reset form
        setTitle('');
        setDescription('');
        setPrivateNotes('');
        setAnswer1('');
        setAnswer2('');
      }

      return (
        <div class="max-w-3xl mx-auto space-y-6">

            <p class="text-xs text-slate-500">Record found belongings handed in at the Admin Office with secure shelf tracking and verification challenges.</p>
          </div>

              </div>
            </div>

            {/* Public Description vs Hidden Private Notes */}

                </label>

                  required

                  onChange={e => setPrivateNotes(e.target.value)}

            {/* Campus Map Pin Picker */}

            {/* Storage Tracking & Locked Cabinet Flag */}
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
              <div class="text-xs font-bold text-slate-900 flex items-center gap-2">
                <span>🗄️</span> <span>Secure Storage Custody Tracking</span>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-slate-600 mb-1">Numbered Shelf / Slot</label>

                <div class="sm:col-span-2 flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200">

                    <div class="text-xs font-bold text-slate-800">Locked Cabinet Recommended</div>
                    <div class="text-[10px] text-slate-500">Auto-suggested for phones, wallets, laptops</div>
                  </div>
                  <input

                    checked={isLockedCabinet} 
                    onChange={e => setIsLockedCabinet(e.target.checked)} 
                    class="w-5 h-5 text-purple-600 rounded" 
                  />
                </div>
              </div>
              {isLockedCabinet && (
                <div class="flex items-center gap-3">
                  <span class="text-xs text-purple-800 font-bold">Cabinet Assignment:</span>
                  <select 
                    value={lockedCabinetNo} 
                    onChange={e => setLockedCabinetNo(e.target.value)} 
                    class="bg-white border border-purple-200 rounded-xl px-3 py-1.5 text-xs font-bold text-purple-900"
                  >
                    <option>Locked Cabinet #1 (Electronics & Laptops)</option>
                    <option>Locked Cabinet #2 (Wallets, Cash & Cards)</option>

                  {studentMatches.map(s => (
                    <div 
                      key={s.uid} 
                      onClick={() => { setSelectedFinder(s); setFinderSearch(`${s.fullName} (${s.rollNumber})`); }} 
                      class="p-2 hover:bg-blue-50 rounded-lg cursor-pointer text-xs flex justify-between"
                    >
                      <span class="font-bold">{s.fullName}</span>
                      <span class="font-mono text-slate-500">{s.rollNumber} • {s.department}</span>
                    </div>
                  ))}

              )}
            </div>

            {/* Verification Questions (1-2) */}
            <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-200 space-y-3">

                  />
                  <input 
                    type="text" 
                    value={answer1} 
                    onChange={e => setAnswer1(e.target.value)}

                    class="w-full bg-white border border-emerald-300 rounded-xl px-3 py-2 text-xs font-medium"

                  <label class="block text-[11px] font-bold text-slate-600 mb-1">Question 2 (Optional)</label>

                    type="text" 
                    value={question2} 
                    onChange={e => setQuestion2(e.target.value)}

                  />
                  <input 
                    type="text" 
                    value={answer2} 
                    onChange={e => setAnswer2(e.target.value)}

            <button

    // =========================================================================
    // ADMIN: CLAIM MANAGEMENT (ADVANCE THROUGH WORKFLOW & SENSITIVE ITEMS PROTOCOL)
    // Requested -> Approved -> Ready for Pickup -> Collected (Permanent Handover Log)
    // =========================================================================
    function AdminClaimsManagement({ db, onUpdateClaimStatus, onRecordHandover }) {
      const [selectedClaim, setSelectedClaim] = useState(null);
      const [rejectionReason, setRejectionReason] = useState('');
      const [handoverStaff, setHandoverStaff] = useState('office1.admin');
      const [isIdVerified, setIsIdVerified] = useState(false);
      const [handoverModalOpen, setHandoverModalOpen] = useState(false);

      const claims = db.claims || [];

      function handleAdvance(claim, nextStatus) {
        if (nextStatus === 'Collected') {
          // Trigger physical handover log modal
          setSelectedClaim(claim);
          setHandoverModalOpen(true);
        } else {
          onUpdateClaimStatus(claim.id, nextStatus);
          playBeep('success');
        }
      }

      function handleCompleteHandover() {
        if (!isIdVerified) {
          alert('Verification Checklist: You must confirm that the student\'s physical College ID card has been inspected!');
          return;
        }

        const logId = `HLOG-2026-${Math.floor(100 + Math.random() * 899)}`;
        const handoverRecord = {
          id: logId,
          itemId: selectedClaim.itemId,
          itemTitle: selectedClaim.itemTitle,

    // =========================================================================
    // ADMIN: AUTO-MATCHING ENGINE
    // Compares student lost reports against found items (category, keywords, location, date)
    // =========================================================================
    function AdminAutoMatching({ db, onNotifyMatch }) {
      const lostReports = db.lostReports || [];
      const items = db.items || [];

      // Calculate algorithmic match scores
      const matches = useMemo(() => {
        const results = [];
        lostReports.forEach(report => {
          items.forEach(item => {
            if (item.status === 'Returned') return;

            let score = 0;
            // 1. Category match (35 pts)
            if (report.category === item.category) score += 35;

            // 2. Keyword similarity in description (up to 35 pts)
            const reportWords = (report.description || '').toLowerCase().split(/\s+/).filter(w => w.length > 3);
            const itemText = `${item.title} ${item.description}`.toLowerCase();
            let wordMatches = 0;
            reportWords.forEach(w => {
              if (itemText.includes(w)) wordMatches++;
            });
            if (reportWords.length > 0) {
              score += Math.min(35, Math.round((wordMatches / reportWords.length) * 35));
            }

            // 3. Location proximity (15 pts)
            if (report.locationName && item.locationName && (
              report.locationName.toLowerCase().includes(item.locationName.toLowerCase()) ||
              item.locationName.toLowerCase().includes(report.locationName.toLowerCase())
            )) {
              score += 15;
            }

            // 4. Date proximity within 7 days (15 pts)
            if (report.dateLost && item.dateFound) {
              const d1 = new Date(report.dateLost);
              const d2 = new Date(item.dateFound);
              const diff = Math.abs((d1 - d2) / (1000 * 60 * 60 * 24));
              if (diff <= 3) score += 15;
              else if (diff <= 7) score += 10;
            }

            if (score >= 45) {
              results.push({
                report,
                item,
                score
              });
            }
          });
        });

        results.sort((a, b) => b.score - a.score);
        return results;
      }, [lostReports, items]);

      return (
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-heading font-extrabold text-slate-900">Auto-Matching Engine</h2>
            <p class="text-xs text-slate-500">
              The matching algorithm evaluates category, text keywords, Dr. MCET campus location proximity, and dates to flag high-confidence pairs for admin review.
            </p>
          </div>

          {matches.length === 0 ? (
            <div class="bg-white rounded-3xl p-12 text-center border border-slate-200 shadow-sm">
              <div class="w-16 h-16 rounded-2xl bg-slate-100 mx-auto flex items-center justify-center text-3xl mb-3">
                ⚡
              </div>
              <h3 class="text-base font-bold text-slate-800">No Potential Auto-Matches Found</h3>
              <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1">
                Currently, no active lost reports correlate closely with cataloged found articles.
              </p>
            </div>
          ) : (
            <div class="space-y-4">
              {matches.map(({ report, item, score }, idx) => (
                <div key={idx} class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6">
                  {/* Left: Lost Report */}
                  <div class="flex-1 space-y-1">
                    <span class="text-[10px] font-bold text-red-600 uppercase tracking-wider bg-red-50 px-2 py-0.5 rounded border border-red-200">
                      Student Lost Report ({report.id})
                    </span>
                    <h4 class="text-sm font-bold text-slate-900 mt-1">{report.category}</h4>
                    <p class="text-xs text-slate-600 leading-relaxed">"{report.description}"</p>
                    <div class="text-[11px] text-slate-500">
                      Reported by: <strong>{report.studentName}</strong> ({report.studentRollNo}) • {report.locationName}
                    </div>
                  </div>

                  {/* Center: Match Score Gauge */}
                  <div class="flex flex-col items-center justify-center px-4">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-500 to-orange-500 text-white font-extrabold text-sm flex items-center justify-center shadow-lg">
                      {score}%
                    </div>
                    <span class="text-[10px] font-bold text-amber-700 uppercase tracking-wider mt-1">Match Index</span>
                  </div>

                  {/* Right: Found Item */}
                  <div class="flex-1 space-y-1">
                    <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                      Cataloged Item ({item.id})
                    </span>
                    <h4 class="text-sm font-bold text-slate-900 mt-1">{item.title}</h4>
                    <p class="text-xs text-slate-600 leading-relaxed">{item.description}</p>
                    <div class="text-[11px] text-slate-500">
                      Location: <strong>{item.locationName}</strong> • Storage: {item.storageNumber}
                    </div>
                  </div>

                  {/* One-Click Action */}
                  <div>
                    <button 
                      type="button" 
                      onClick={() => onNotifyMatch(report, item, score)} 
                      class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-md transition whitespace-nowrap"
                    >

    // =========================================================================
    // ADMIN: MONTHLY REPORTS & ANALYTICS CHARTS (EXPORT PDF & CSV)
    // =========================================================================
    function AdminReports({ items }) {
      const chartCategoryRef = useRef(null);
      const chartLocationRef = useRef(null);
      const chartInstance1 = useRef(null);
      const chartInstance2 = useRef(null);

      // Category breakdown
      const categoryCounts = useMemo(() => {
        const counts = {};
        items.forEach(i => {
          counts[i.category] = (counts[i.category] || 0) + 1;
        });
        return counts;
      }, [items]);

      // Location hotspots
      const locationCounts = useMemo(() => {
        const counts = {};
        items.forEach(i => {
          const loc = i.coordinates?.zone || i.locationName.split(',')[0].split('(')[0].trim();
          counts[loc] = (counts[loc] || 0) + 1;
        });
        return counts;
      }, [items]);

      useEffect(() => {
        if (chartCategoryRef.current) {
          if (chartInstance1.current) chartInstance1.current.destroy();
          const ctx = chartCategoryRef.current.getContext('2d');
          chartInstance1.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: Object.keys(categoryCounts),
              datasets: [{
                data: Object.values(categoryCounts),
                backgroundColor: ['#2563eb', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#64748b', '#06b6d4', '#e11d48']
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
            }
          });
        }

        if (chartLocationRef.current) {
          if (chartInstance2.current) chartInstance2.current.destroy();
          const ctx = chartLocationRef.current.getContext('2d');
          chartInstance2.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: Object.keys(locationCounts),
              datasets: [{
                label: 'Articles Found',
                data: Object.values(locationCounts),
                backgroundColor: '#2563eb',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
          });
        }

        return () => {
          if (chartInstance1.current) chartInstance1.current.destroy();
          if (chartInstance2.current) chartInstance2.current.destroy();
        };
      }, [categoryCounts, locationCounts]);

      // Export CSV
      function exportCSV() {
        const headers = ["Token ID", "Title", "Category", "Location", "Date Found", "Storage Shelf", "Status"];
        const rows = items.map(i => [
          i.id,
          `"${i.title.replace(/"/g, '""')}"`,
          i.category,
          `"${i.locationName.replace(/"/g, '""')}"`,
          i.dateFound,
          i.storageNumber || '',
          i.status
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `MCET_Lost_and_Found_Report_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      // Print PDF view
      function exportPDF() {
        window.print();
      }

      return (
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-heading font-extrabold text-slate-900">Institutional Reports &amp; Hotspot Analytics</h2>
              <p class="text-xs text-slate-500">Visual data breakdown of lost categories and campus loss hotspots across MCET.</p>
            </div>
            <div class="flex items-center gap-2">
              <button 
                type="button" 
                onClick={exportCSV} 
                class="bg-white hover:bg-slate-50 text-slate-700 font-bold px-3.5 py-2 rounded-xl border border-slate-200 text-xs shadow-sm flex items-center gap-1.5 transition"
              >
                <Icon name="download" className="w-4 h-4 text-emerald-600" />
                <span>Export CSV</span>
              </button>
              <button 
                type="button" 
                onClick={exportPDF} 
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-sm flex items-center gap-1.5 transition"
              >
                <Icon name="fileText" className="w-4 h-4" />
                <span>Export / Print PDF</span>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-900">Most Frequently Lost Categories</h3>
                <span class="text-[11px] font-mono text-slate-400">Total: {items.length} items</span>
              </div>
              <div class="h-64 flex items-center justify-center">
                <canvas ref={chartCategoryRef}></canvas>
              </div>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-900">Campus Hotspots (Top Loss Locations)</h3>
                <span class="text-[11px] font-mono text-slate-400">Dr. MCET Grounds</span>
              </div>
              <div class="h-64 flex items-center justify-center">
                <canvas ref={chartLocationRef}></canvas>
              </div>
            </div>
          </div>
        </div>
      );
    }

        onSaveSettings({
          ...db.appSettings,
          holdingPeriodDays: parseInt(holdingDays, 10),
          officeHours,
          contactPhone
        });
        playBeep('success');
        alert('Institutional holding period configuration updated successfully!');
      }

      function handleTriggerDigest() {
        onTriggerWeeklyBatch();
        setDigestMessage('✓ Weekly batch digest generated and dispatched to all student inboxes!');

        fireConfetti();

      return (
        <div class="max-w-2xl mx-auto space-y-6">

                  max="60" 
                  value={holdingDays} 
                  onChange={e => setHoldingDays(e.target.value)} 
                  class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" 
                />
                <span class="w-16 text-center font-mono font-bold text-blue-600 bg-blue-50 border border-blue-200 py-1.5 px-3 rounded-xl text-sm">
                  {holdingDays} d
                </span>
              </div>
              <span class="text-[11px] text-slate-500 mt-1 block">

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">

                  type="text" 
                  value={officeHours} 
                  onChange={e => setOfficeHours(e.target.value)} 
                  class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs"

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">

            </div>

            <button

              class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl text-xs transition"
            >
              Save Configuration Settings
            </button>
          </form>

          {/* Weekly Batch Digest Trigger */}
          <div class="bg-gradient-to-r from-blue-900 via-indigo-950 to-blue-900 text-white p-6 rounded-3xl shadow-md space-y-3">
            <div class="flex items-center gap-3">
              <span class="text-2xl">📢</span>
              <div>
                <h3 class="text-sm font-bold text-white">Weekly Unclaimed Articles Batch Digest</h3>

                  Instead of individual messages, the scheduled function aggregates all unclaimed items into one weekly notification digest.

    // =========================================================================
    // MAIN APP ROOT CONTROLLER
    // =========================================================================
    function App() {
      const [db, setDb] = useState(initDatabase);
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('mcet_logged_user_v5');
        return saved ? JSON.parse(saved) : null;
      });

      // Navigation state
      // For student: 'browse', 'reportFound', 'reportLost', 'claims', 'notifications', 'profile'
      // For admin: 'dashboard', 'intake', 'claims', 'sensitive', 'autoMatch', 'handover', 'students', 'reports', 'settings'
      const [activeTab, setActiveTab] = useState('browse');
      const [claimTargetItem, setClaimTargetItem] = useState(null);
      const [expiryModalItem, setExpiryModalItem] = useState(null);

      // Save database helper
      function updateDb(newDb) {
        setDb(newDb);
        saveDatabase(newDb);
      }

      // Handle user login
      function handleLoginSuccess(user) {
        setCurrentUser(user);
        localStorage.setItem('mcet_logged_user_v5', JSON.stringify(user));
        if (user.role === 'admin') setActiveTab('dashboard');
        else setActiveTab('browse');
      }

      // Handle sign out
      function handleSignOut() {
        setCurrentUser(null);
        localStorage.removeItem('mcet_logged_user_v5');
      }

      // Handle mandatory student profile completion
      function handleSaveStudentProfile(profileData) {
        const updatedUser = { ...currentUser, ...profileData, profileComplete: true };
        setCurrentUser(updatedUser);
        localStorage.setItem('mcet_logged_user_v5', JSON.stringify(updatedUser));

        const nextDb = { ...db };
        nextDb.users[updatedUser.uid] = updatedUser;
        updateDb(nextDb);
        playBeep('success');
        fireConfetti();
      }

      // Add found item (Admin Intake or Student Report)
      function handleAddFoundItem(item) {
        const nextDb = { ...db, items: [item, ...db.items] };
        updateDb(nextDb);
      }

      // Add lost report
      function handleAddLostReport(report) {
        const nextDb = { ...db, lostReports: [report, ...db.lostReports] };
        updateDb(nextDb);
      }

      // Add student claim
      function handleAddClaim(claim) {
        const nextDb = {
          ...db,
          claims: [claim, ...db.claims],
          items: db.items.map(it => it.id === claim.itemId ? { ...it, status: 'Claimed' } : it)
        };
        updateDb(nextDb);
      }

      // Update claim status (Admin)
      function handleUpdateClaimStatus(claimId, newStatus, reason = null) {
        const nextDb = {
          ...db,
          claims: db.claims.map(c => {
            if (c.id === claimId) {
              return { ...c, status: newStatus, rejectionReason: reason };
            }
            return c;
          })
        };

        // Notify student
        const targetClaim = db.claims.find(c => c.id === claimId);
        if (targetClaim) {
          nextDb.notifications.unshift({
            id: 'NTF-' + Date.now(),
            recipientUid: targetClaim.studentUid,
            title: newStatus === 'Approved' ? '🎉 Claim Approved!' : newStatus === 'Ready for Pickup' ? '🏛️ Ready for Pickup!' : 'Claim Notice',
            message: `Your claim for "${targetClaim.itemTitle}" has been updated to ${newStatus}.`,
            type: 'claim_status',
            read: false,
            createdAt: new Date().toISOString()
          });
        }
        updateDb(nextDb);
      }

      // Permanent Handover Log Record
      function handleRecordHandover(handoverRecord, claimId, itemId) {
        const nextDb = {
          ...db,
          handoverLogs: [handoverRecord, ...db.handoverLogs],
          items: db.items.map(i => i.id === itemId ? { ...i, status: 'Returned' } : i),
          claims: db.claims.map(c => c.id === claimId ? { ...c, status: 'Collected' } : c)
        };
        updateDb(nextDb);
      }

      // Trigger weekly batch broadcast notification
      function handleTriggerWeeklyBatch() {
        const unclaimed = db.items.filter(i => i.status === 'Unclaimed' && !i.isSensitive);
        const digestNotif = {
          id: 'DIGEST-' + Date.now(),
          recipientUid: 'all',
          isBroadcast: true,
          title: `📢 Weekly Lost & Found Digest (${unclaimed.length} Unclaimed Items)`,
          message: `Summary of ${unclaimed.length} items logged this week at the College Admin Office. Check before the ${db.appSettings.holdingPeriodDays}-day holding period expires.`,
          itemsSummary: unclaimed.map(u => `${u.title} (${u.locationName})`).join('; '),
          type: 'weekly_digest',
          read: false,
          createdAt: new Date().toISOString()
        };
        updateDb({ ...db, notifications: [digestNotif, ...db.notifications] });
      }

      // Auto-Expiry Resolution Action (Donated, Disposed, Welfare Fund)
      function handleResolveExpiryAction(item, action) {
        const nextDb = {
          ...db,
          items: db.items.map(it => it.id === item.id ? { ...it, expiryAction: action } : it)
        };
        updateDb(nextDb);
        setExpiryModalItem(null);
        playBeep('success');
        alert(`Article ${item.id} resolved as: ${action}`);
      }

      // Alert student from Auto-Match
      function handleNotifyMatch(report, item, score) {
        const alertNotif = {
          id: 'NTF-' + Date.now(),
          recipientUid: report.studentUid,
          title: `⚡ Likely Match Found (${score}% Confidence)`,
          message: `A found article "${item.title}" at ${item.locationName} has an auto-match score of ${score}% with your lost report. Visit browse to inspect!`,
          type: 'match_alert',
          read: false,
          createdAt: new Date().toISOString()
        };
        updateDb({ ...db, notifications: [alertNotif, ...db.notifications] });
        playBeep('success');
        alert(`Alert notification dispatched to ${report.studentName} (${report.studentRollNo})!`);
      }

      // If user not authenticated, show login page
      if (!currentUser) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} db={db} />;
      }

      // If first-time student, render Mandatory Profile Setup Modal
      if (currentUser.role === 'student' && !currentUser.profileComplete) {
        return <MandatoryProfileModal user={currentUser} onSave={handleSaveStudentProfile} />;
      }

      const isAdmin = currentUser.role === 'admin';
      const holdingPeriodDays = db.appSettings?.holdingPeriodDays || 45;

      return (
        <div class="min-h-screen flex flex-col bg-slate-100 text-slate-900">
          {/* Top Universal Navbar */}
          <header class="bg-slate-950 text-white border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Brand Logo & College Title */}
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-amber-500 flex items-center justify-center text-xl shadow-lg shadow-blue-500/20">
                  🎓
                </div>
                <div>
                  <h1 class="text-sm sm:text-base font-heading font-extrabold text-white leading-tight flex items-center gap-2">
                    <span>MCET Lost &amp; Found Portal</span>
                    <span class={`text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                      isAdmin ? 'bg-amber-400 text-slate-950' : 'bg-blue-600 text-white'
                    }`}>
                      {isAdmin ? 'ADMIN CELL' : 'STUDENT'}
                    </span>
                  </h1>
                  <p class="text-[10px] text-slate-400">Dr. Mahalingam College of Engineering &amp; Technology</p>
                </div>
              </div>

              {/* User Chip & Logout */}
              <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-2xl text-xs">
                  <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-[11px]">
                    {currentUser.fullName ? currentUser.fullName.charAt(0) : 'U'}
                  </div>
                  <span class="font-medium text-slate-200">{currentUser.fullName}</span>
                  {currentUser.rollNumber && (
                    <span class="font-mono text-amber-400 text-[11px]">({currentUser.rollNumber})</span>

                </div>
                <button 
                  type="button" 
                  onClick={handleSignOut} 
                  class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white p-2 rounded-xl text-xs transition border border-slate-700"

                <div class="px-3 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">

                </div>
                {[
                  { id: 'dashboard', label: 'Intake Dashboard', icon: 'clipboard' },
                  { id: 'intake', label: 'Log Found Article', icon: 'plus' },
                  { id: 'claims', label: 'Claim Requests', icon: 'checkCircle' },
                  { id: 'sensitive', label: 'Sensitive Items (Quarantine)', icon: 'shield' },
                  { id: 'autoMatch', label: 'Auto-Matches', icon: 'zap' },
                  { id: 'handover', label: 'Handover Log (Audit)', icon: 'lock' },
                  { id: 'students', label: 'Student Directory', icon: 'users' },
                  { id: 'reports', label: 'Monthly Reports & Hotspots', icon: 'chart' },

          {/* STUDENT MOBILE BOTTOM NAVIGATION (BROWSE, REPORT FOUND, REPORT LOST, MY CLAIMS, PROFILE) */}
          {!isAdmin && (
            <nav class="bg-white/95 backdrop-blur-md border-t border-slate-200 sticky bottom-0 z-40 py-2 px-3 shadow-lg">
              <div class="max-w-md mx-auto grid grid-cols-6 gap-1">
                {[
                  { id: 'browse', label: 'Browse', icon: 'search' },
                  { id: 'reportFound', label: 'Found', icon: 'plus' },
                  { id: 'reportLost', label: 'Lost', icon: 'mapPin' },
                  { id: 'claims', label: 'Claims', icon: 'clipboard' },
                  { id: 'notifications', label: 'Alerts', icon: 'bell' },
                  { id: 'profile', label: 'Profile', icon: 'user' }
                ].map(tab => (
                  <button 
                    key={tab.id} 
                    type="button" 
                    onClick={() => setActiveTab(tab.id)} 
                    class={`flex flex-col items-center justify-center py-1 rounded-xl transition ${
                      activeTab === tab.id 
                        ? 'text-blue-600 font-extrabold' 
                        : 'text-slate-400 hover:text-slate-600'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-5 h-5 mb-0.5" />
                    <span class="text-[10px] font-bold leading-none">{tab.label}</span>
                  </button>
                ))}
              </div>
            </nav>
          )}

          {/* CLAIM VERIFICATION MODAL */}
          {claimTargetItem && (
            <ClaimModal 
              item={claimTargetItem} 
              student={currentUser} 
              onClose={() => setClaimTargetItem(null)} 
              onSubmitClaim={handleAddClaim} 
            />
          )}

          {/* EXPIRED ITEM RESOLUTION MODAL (ADMIN: DONATED, DISPOSED, WELFARE FUND) */}
          {expiryModalItem && (
            <div class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-slate-100">
                <div class="border-b border-slate-100 pb-3">
                  <span class="text-xs font-mono font-bold text-red-700 bg-red-50 px-2.5 py-0.5 rounded border border-red-200">
                    HOLDING PERIOD EXPIRED
                  </span>
                  <h3 class="text-lg font-bold text-slate-900 mt-1">Resolve Expired Article</h3>
                  <p class="text-xs text-slate-500">Item has remained unclaimed after {holdingPeriodDays} days in custody.</p>
                </div>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-xs">
                  <div><strong>Article:</strong> {expiryModalItem.title} ({expiryModalItem.id})</div>
                  <div><strong>Location Found:</strong> {expiryModalItem.locationName}</div>
                  <div><strong>Date Found:</strong> {expiryModalItem.dateFound}</div>
                </div>

                <div class="space-y-2 pt-2">
                  <button 
                    type="button" 
                    onClick={() => handleResolveExpiryAction(expiryModalItem, 'Donated')} 
                    class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-200 font-bold p-3 rounded-xl text-xs flex items-center justify-between"
                  >
                    <span>🎁 Mark as Donated (NSS / Orphanage)</span>
                    <span>→</span>
                  </button>
                  <button 
                    type="button" 
                    onClick={() => handleResolveExpiryAction(expiryModalItem, 'Welfare Fund')} 
                    class="w-full bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-bold p-3 rounded-xl text-xs flex items-center justify-between"
                  >
                    <span>🏛️ Send to MCET Student Welfare Council Auction</span>
                    <span>→</span>
                  </button>
                  <button 
                    type="button" 
                    onClick={() => handleResolveExpiryAction(expiryModalItem, 'Disposed')} 
                    class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 font-bold p-3 rounded-xl text-xs flex items-center justify-between"
                  >
                    <span>♻️ Mark Disposed (E-Waste / Recycling)</span>
                    <span>→</span>
                  </button>
                </div>

                <button 
                  type="button" 
                  onClick={() => setExpiryModalItem(null)} 
                  class="w-full text-slate-500 hover:text-slate-700 text-xs font-bold py-2"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render React 18 Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
